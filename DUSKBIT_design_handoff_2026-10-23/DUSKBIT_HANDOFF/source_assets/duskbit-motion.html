const bodies=[...document.querySelectorAll('.ink-body')];
const ink=document.getElementById('animated-ink'),nib=document.getElementById('nib'),seek=document.getElementById('seek'),time=document.getElementById('time'),phase=document.getElementById('phase'),play=document.getElementById('play');
const TOTAL=MODEL.total,FADE_START=MODEL.drawEnd+MODEL.hold;
let cursor=0,rate=1,last=null,running=true,showGuides=false;
function edgeAt(a,t){
 let lo=0,hi=a.length-1;while(hi-lo>1){const k=(lo+hi)>>1;if(a[k][0]<=t)lo=k;else hi=k}
 const u=(t-a[lo][0])/Math.max(a[hi][0]-a[lo][0],1e-8);
 return{index:lo,p:[a[lo][1]+(a[hi][1]-a[lo][1])*u,a[lo][2]+(a[hi][2]-a[lo][2])*u]};
}
function growingContour(s,t){
 if(t<=0)return{d:'',tip:null};if(t>=1)return{d:s.d,tip:null};
 if(s.dot){const k=Math.sin(t*Math.PI/2),x=s.center[0],y=s.center[1];return{d:s.d,transform:`translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})`,tip:[x,y]}}
 const l=edgeAt(s.left,t),r=edgeAt(s.right,t);
 const pts=s.left.slice(0,l.index+1).map(q=>[q[1],q[2]]);pts.push(l.p,r.p);
 for(let i=r.index;i>=0;i--)pts.push([s.right[i][1],s.right[i][2]]);
 return{d:'M'+pts.map(q=>q[0].toFixed(2)+','+q[1].toFixed(2)).join('L')+'Z',tip:[(l.p[0]+r.p[0])/2,(l.p[1]+r.p[1])/2]};
}
function render(ms){
 let active=null;MODEL.shapes.forEach((s,i)=>{const p=Math.max(0,Math.min(1,(ms-s.start)/s.duration)),v=growingContour(s,p),el=bodies[i];el.setAttribute('d',v.d);el.setAttribute('transform',v.transform||'');if(p>0&&p<1)active={s,v}});
 const opacity=ms<=FADE_START?1:Math.max(0,1-(ms-FADE_START)/MODEL.fade);ink.style.opacity=opacity;
 nib.setAttribute('visibility',showGuides&&active&&active.v.tip&&opacity>0?'visible':'hidden');if(active&&active.v.tip){nib.setAttribute('cx',active.v.tip[0]);nib.setAttribute('cy',active.v.tip[1])}
 seek.value=String(Math.round(ms));time.textContent=(ms/1000).toFixed(1)+' / '+(TOTAL/1000).toFixed(1)+'s';phase.textContent=ms<180?'准备落笔':ms>=FADE_START?(opacity>0?'淡出':'下一轮'):ms>=MODEL.drawEnd?'完整停留':active?'正在书写 · '+active.s.name:'抬笔';
}
function setRunning(v){running=v;play.textContent=v?'暂停':'播放';last=null}
function tick(stamp){if(last!==null&&running)cursor=(cursor+Math.min(stamp-last,80)*rate)%TOTAL;last=stamp;render(cursor);requestAnimationFrame(tick)}
play.addEventListener('click',()=>setRunning(!running));document.getElementById('replay').addEventListener('click',()=>{cursor=0;setRunning(true);render(cursor)});document.getElementById('speed').addEventListener('change',e=>{rate=Number(e.target.value)});seek.addEventListener('input',e=>{cursor=Number(e.target.value);setRunning(false);render(cursor)});
document.getElementById('guides').addEventListener('click',e=>{showGuides=!showGuides;document.body.classList.toggle('show-guides',showGuides);e.target.setAttribute('aria-pressed',String(showGuides));e.target.textContent=showGuides?'隐藏笔顺':'查看笔顺';render(cursor)});
document.getElementById('theme').addEventListener('click',()=>{const light=document.body.classList.toggle('light');document.getElementById('theme').setAttribute('aria-label',light?'切换深色背景':'切换浅色背景')});document.getElementById('download').addEventListener('click',()=>{const u=URL.createObjectURL(new Blob([svgMarkup],{type:'image/svg+xml;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='duskbit.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)});document.addEventListener('visibilitychange',()=>{last=null});
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){cursor=MODEL.drawEnd+200;setRunning(false);document.getElementById('reduced').classList.add('visible')}
render(cursor);requestAnimationFrame(tick);
