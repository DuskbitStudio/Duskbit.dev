<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duskbit — 暮点工作室</title>
    <meta name="description" content="Duskbit（暮点工作室）是一个独立软件工作室。前身是 Feedra。" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9.5 7'%3E%3Cpath fill='%230a0a0a' d='M0 0H2.5V1H1V6H2.5V7H0Z M9.5 0H7V1H8.5V6H7V7H9.5Z'/%3E%3Crect x='3.25' y='2' width='3' height='3' fill='%23F26B3A'/%3E%3C/svg%3E" />
    <script>
      // Apply a saved theme before first paint so the intro never flashes the wrong palette.
      try {
        var t = localStorage.getItem('duskbit-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
